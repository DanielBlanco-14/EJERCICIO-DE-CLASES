<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Producto</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body>
<nav><h2>Ventas & Inventario</h2><div><a href="/">Inicio</a><a href="/usuarios">Usuarios</a><a href="/productos">Inventario</a><a href="/ventas">Ventas</a></div></nav>
<main class="container narrow">
    <h1 th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</h1>
    <form class="form" th:action="@{/productos/guardar}" th:object="${producto}" method="post">
        <input type="hidden" th:field="*{id}">
        <label>Nombre<input type="text" th:field="*{nombre}"><span class="error" th:errors="*{nombre}"></span></label>
        <label>Descripción<textarea th:field="*{descripcion}"></textarea></label>
        <label>Categoría<input type="text" th:field="*{categoria}"></label>
        <label>Precio<input type="number" step="0.01" min="0.01" th:field="*{precio}"><span class="error" th:errors="*{precio}"></span></label>
        <label>Cantidad<input type="number" min="0" th:field="*{cantidad}"><span class="error" th:errors="*{cantidad}"></span></label>
        <div><button class="button" type="submit">Guardar</button> <a class="button secondary" href="/productos">Cancelar</a></div>
    </form>
</main>
</body>
</html>
