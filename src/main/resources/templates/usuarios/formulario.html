<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuario - Sistema de Ventas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>

<body>

<header class="navbar">

    <h1>Sistema de Ventas</h1>

    <nav>
        <a href="/">Inicio</a>
        <a href="/usuarios">Usuarios</a>
        <a href="/productos">Inventario</a>
        <a href="/ventas">Ventas</a>
    </nav>

</header>

<main class="container">

    <div class="page-header">

        <div>
            <h2>Registrar usuario</h2>
            <p>Completa la información del usuario.</p>
        </div>

    </div>

    <div class="card form-card">

        <form
            th:action="@{/usuarios/guardar}"
            th:object="${usuario}"
            method="post">

            <input
                type="hidden"
                th:field="*{id}">

            <div class="form-group">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    th:field="*{nombre}"
                    placeholder="Nombre"
                    required>

            </div>

            <div class="form-group">

                <label for="apellido">
                    Apellido
                </label>

                <input
                    type="text"
                    id="apellido"
                    th:field="*{apellido}"
                    placeholder="Apellido"
                    required>

            </div>

            <div class="form-group">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    th:field="*{correo}"
                    placeholder="correo@ejemplo.com"
                    required>

            </div>

            <div class="form-group">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="text"
                    id="telefono"
                    th:field="*{telefono}"
                    placeholder="Teléfono"
                    required>

            </div>

            <div class="form-buttons">

                <a href="/usuarios" class="btn btn-secondary">
                    Cancelar
                </a>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Guardar usuario
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
