<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
<nav><h2>Ventas & Inventario</h2><div><a href="/">Inicio</a><a href="/usuarios">Usuarios</a><a href="/productos">Inventario</a><a href="/ventas">Ventas</a></div></nav>
<main class="container">
    <div class="top">
        <div><h1>Usuarios</h1><p class="subtitulo">Registro y administración de clientes.</p></div>
        <a class="button" href="/usuarios/nuevo">+ Nuevo usuario</a>
    </div>
    <table>
        <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Teléfono</th><th>Acciones</th></tr></thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.nombre + ' ' + u.apellido}"></td>
            <td th:text="${u.correo}"></td>
            <td th:text="${u.telefono}"></td>
            <td class="actions">
                <a class="small" th:href="@{/usuarios/editar/{id}(id=${u.id})}">Editar</a>
                <form th:action="@{/usuarios/eliminar/{id}(id=${u.id})}" method="post">
                    <button class="danger small" type="submit" onclick="return confirm('¿Eliminar usuario?')">Eliminar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}"><td colspan="5" class="empty">No hay usuarios registrados.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
