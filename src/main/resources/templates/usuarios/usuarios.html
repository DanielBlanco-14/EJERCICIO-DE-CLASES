<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios - Sistema de Ventas</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="navbar">

    <h1>Sistema de Ventas</h1>

    <nav>
        <a href="/">Inicio</a>
        <a href="/usuarios">Usuarios</a>
        <a href="/productos">Inventario</a>
        <a href="/ventas">Ventas</a>
    </nav>

</header>

<main class="container">

    <div class="page-header">

        <div>
            <h2>Usuarios</h2>
            <p>Administración de usuarios registrados.</p>
        </div>

        <a href="/usuarios/nuevo" class="btn btn-primary">
            + Nuevo usuario
        </a>

    </div>

    <div class="card">

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Correo</th>
                <th>Teléfono</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="usuario : ${usuarios}">

                <td th:text="${usuario.id}"></td>

                <td th:text="${usuario.nombre}"></td>

                <td th:text="${usuario.apellido}"></td>

                <td th:text="${usuario.correo}"></td>

                <td th:text="${usuario.telefono}"></td>

                <td class="actions">

                    <a
                        th:href="@{/usuarios/editar/{id}(id=${usuario.id})}"
                        class="btn btn-edit">
                        Editar
                    </a>

                    <a
                        th:href="@{/usuarios/eliminar/{id}(id=${usuario.id})}"
                        class="btn btn-delete"
                        onclick="return confirm('¿Deseas eliminar este usuario?');">
                        Eliminar
                    </a>

                </td>

            </tr>

            <tr th:if="${#lists.isEmpty(usuarios)}">

                <td colspan="6" class="empty">
                    No hay usuarios registrados.
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</main>

</body>
</html>
