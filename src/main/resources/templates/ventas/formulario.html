<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Nueva venta</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body>
<nav><h2>Ventas & Inventario</h2><div><a href="/">Inicio</a><a href="/usuarios">Usuarios</a><a href="/productos">Inventario</a><a href="/ventas">Ventas</a></div></nav>
<main class="container narrow">
    <h1>Registrar venta</h1>
    <div class="alert" th:if="${error}" th:text="${error}"></div>
    <form class="form" action="/ventas/guardar" method="post">
        <label>Usuario
            <select name="usuarioId" required>
                <option value="">Seleccione un usuario</option>
                <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombre + ' ' + u.apellido}"></option>
            </select>
        </label>
        <label>Producto
            <select name="productoId" required>
                <option value="">Seleccione un producto</option>
                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre + ' | Stock: ' + p.cantidad + ' | $' + p.precio}"></option>
            </select>
        </label>
        <label>Cantidad<input type="number" name="cantidad" min="1" required></label>
        <div><button class="button" type="submit">Registrar venta</button> <a class="button secondary" href="/ventas">Cancelar</a></div>
    </form>
</main>
</body>
</html>
