<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Ventas</title><link rel="stylesheet" href="/css/estilos.css"></head>
<body>
<nav><h2>Ventas & Inventario</h2><div><a href="/">Inicio</a><a href="/usuarios">Usuarios</a><a href="/productos">Inventario</a><a href="/ventas">Ventas</a></div></nav>
<main class="container">
    <div class="top"><div><h1>Ventas</h1><p class="subtitulo">Historial de ventas realizadas.</p></div><a class="button" href="/ventas/nueva">+ Registrar venta</a></div>
    <table>
        <thead><tr><th>ID</th><th>Fecha</th><th>Usuario</th><th>Producto</th><th>Cantidad</th><th>Precio</th><th>Total</th></tr></thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.id}"></td><td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${v.usuario.nombre + ' ' + v.usuario.apellido}"></td><td th:text="${v.producto.nombre}"></td>
            <td th:text="${v.cantidad}"></td><td th:text="${'$ ' + v.precioUnitario}"></td><td th:text="${'$ ' + v.total}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventas)}"><td colspan="7" class="empty">No hay ventas registradas.</td></tr>
        </tbody>
    </table>
</main>
</body>
</html>
